name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck yamllint
          pip install markdownlint-cli
          curl -sSL https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 -o hadolint
          chmod +x hadolint
      - name: ShellCheck
        run: shellcheck scripts/*.sh
      - name: YAML lint
        run: yamllint .
      - name: Markdown lint
        run: markdownlint '**/*.md'
      - name: Hadolint
        run: ./hadolint docker/Dockerfile
