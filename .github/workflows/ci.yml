name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt
            /var/lib/apt
          key: ${{ runner.os }}-apt-${{ hashFiles('docker/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck hadolint make jq curl

      - name: Shellcheck scripts
        run: shellcheck scripts/*.sh

      - name: Hadolint Dockerfile
        run: hadolint docker/Dockerfile

      - name: Verify make targets
        run: |
          make -n metrics
          make -n rpc-domain
          make -n snapshot
          make -n upgrade

      - name: Run metrics sanity check
        run: make metrics
