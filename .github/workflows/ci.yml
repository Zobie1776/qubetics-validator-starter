name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck jq

      - name: Shellcheck scripts
        run: shellcheck scripts/*.sh docker/healthcheck.sh

      - name: Dry-run healthcheck
        env:
          HEALTHCHECK_STATUS: '{"result":{"sync_info":{"catching_up":false}}}'
        run: bash scripts/healthcheck.sh

      - name: Verify Make targets
        run: |
          python3 - <<'PY'
import subprocess
from pathlib import Path
required = {"setup", "finish", "status", "logs", "rpc-local", "rpc-expose", "rpc-lockdown", "docker-up", "docker-down", "docker-logs"}
proc = subprocess.run(['make', '-qp'], check=True, capture_output=True, text=True)
available = set()
for line in proc.stdout.splitlines():
    if line.endswith(':') and not line.startswith('	'):
        target = line.split(':', 1)[0].strip()
        if target and target not in {'Makefile', ''} and ' ' not in target:
            available.add(target)
missing = required - available
if missing:
    raise SystemExit(f"Missing Make targets: {', '.join(sorted(missing))}")
PY

      - name: Secret scan
        run: |
          python3 - <<'PY'
import re
import sys
from pathlib import Path
patterns = [
    re.compile(r'BEGIN (?:RSA|EC|DSA) PRIVATE KEY'),
    re.compile(r'aws_secret', re.IGNORECASE),
    re.compile(r'api[_-]?key', re.IGNORECASE),
    re.compile(r'password', re.IGNORECASE),
]
for path in Path('.').rglob('*'):
    if path.is_dir() or '.git' in path.parts:
        continue
    text = path.read_text(errors='ignore')
    for pattern in patterns:
        if pattern.search(text):
            print(f"Potential secret found in {path}")
            sys.exit(1)
PY
