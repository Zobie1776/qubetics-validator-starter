name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v5
        with:
          path: |
            /var/cache/apt
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck make jq curl

      - name: Install hadolint (static binary)
        run: |
          set -euxo pipefail
          ver="v2.13.1"
          arch="$(uname -m)"
          case "$arch" in
            x86_64) asset="hadolint-Linux-x86_64" ;;
            aarch64|arm64) asset="hadolint-Linux-arm64" ;;
            *) echo "Unsupported arch: $arch"; exit 1 ;;
          esac
          curl -sSLf -o hadolint "https://github.com/hadolint/hadolint/releases/download/${ver}/${asset}"
          sudo install -m 0755 hadolint /usr/local/bin/hadolint
          hadolint --version

      - name: Shellcheck scripts
        run: |
          set -euo pipefail
          files="$(git ls-files 'scripts/*.sh' || true)"
          if [ -n "$files" ]; then
            shellcheck -S error $files
            echo "::group::ShellCheck warnings (non-fatal)"
            shellcheck -S warning -f gcc $files || true
            echo "::endgroup::"
          else
            echo "No shell scripts"
          fi

      - name: Hadolint Dockerfile
        run: |
          if [ -f docker/Dockerfile ]; then hadolint docker/Dockerfile; else echo "No Dockerfile"; fi

      - name: Verify make targets
        run: |
          make -n metrics || true
          make -n rpc-domain || true
          make -n snapshot || true
          make -n upgrade || true

      - name: Run metrics sanity check
        run: make metrics || true
