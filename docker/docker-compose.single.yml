version: "3.9"
services:
  validator:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        QUBETICS_SRC_REF: ${QUBETICS_SRC_REF:-main}
    container_name: q-sync-validator
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      RPC: ${RPC:-http://validator:26657}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - qubetics-data:/data
    ports:
      - "${P2P_PORT:-26656}:26656"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD", "/bin/bash", "/app/scripts/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
volumes:
  qubetics-data:
