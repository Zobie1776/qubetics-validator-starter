version: "3.9"
services:
  validator:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: q-sync-validator
    restart: unless-stopped
    volumes:
      - /data:/data
    ports:
      - "26656:26656"
    environment:
      - RPC=http://127.0.0.1:26657
    healthcheck:
      test: ["CMD", "/usr/local/bin/q-sync-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
